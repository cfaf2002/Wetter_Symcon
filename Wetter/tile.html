    Aufbau: aktuelles Wetter oben, darunter Kurzwerte, DWD-Warnungen, Stunden und Tage.
    Die Kachel passt sich per Container-Abfragen ihrer Größe an (klein: nur aktuell,
    groß: alles; breit: zweispaltig). Wettersymbole sind eigene SVG-Symbole.
    Sicherheit: alle Daten werden nur per textContent bzw. als SVG-Attribute gesetzt,
    keine externen Dateien, keine Schriften, kein HTML aus Daten.

<style>
    /* ===== Hausstil cfaf2002 · Kachel-Grundlage v1 (siehe STYLEGUIDE.md) =====
       Farbschema 0 = Symcon-Design (Farben der Visualisierung), 1 = Dunkel, 2 = Hell.
       Modulspezifisch ist nur --brand (Akzent der festen Farbschemas). */
    :root {
        --brand: #2f8fdc;
        --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        --fg: var(--content-color, #eef3f7);
        --accent: var(--accent-color, var(--brand));
        --on-accent: #ffffff;
        --muted: color-mix(in srgb, var(--fg) 65%, transparent);
        --faint: color-mix(in srgb, var(--fg) 40%, transparent);
        --line: color-mix(in srgb, var(--fg) 15%, transparent);
        --surface: color-mix(in srgb, var(--fg) 7%, transparent);
        --surface-hover: color-mix(in srgb, var(--fg) 12%, transparent);
        --popup: var(--card-color, #232a33);
        --ok: #34b36b; --warn: #e2a63b; --bad: #e5484d; --info: #4b8ef0; --off: #8796a5;
        --radius-l: 14px; --radius: 12px; --radius-s: 8px; --pill: 999px; --gap: 8px;
    }
    html.theme-dark  { --fg: #eef3f7; --accent: var(--brand); --tile-bg: #1b2530; --popup: #232d39; }
    html.theme-light { --fg: #1d2b36; --accent: var(--brand); --tile-bg: #e9eef3; --popup: #ffffff; }
    html.theme-dark body, html.theme-light body { background: var(--tile-bg); }
    html, body { font-family: var(--font); color: var(--fg); -webkit-font-smoothing: antialiased; -webkit-tap-highlight-color: transparent; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
    }
    /* ===== Ende Kachel-Grundlage ===== */

    /* Wetterfarben – aus den Tokens abgeleitet */
    #tile {
        --wx-sun: var(--warn);
        --wx-moon: color-mix(in srgb, var(--fg) 75%, var(--warn));
        --wx-cloud: color-mix(in srgb, var(--fg) 40%, var(--off));
        --wx-cloud2: color-mix(in srgb, var(--wx-cloud) 60%, transparent);
        --wx-rain: var(--info);
        --wx-snow: var(--fg);
        --wx-bolt: var(--warn);
        --wx-cold: var(--info);
        --wx-warm: var(--warn);
        --lvl1: color-mix(in srgb, var(--warn) 80%, #ffe14d);
        --lvl2: color-mix(in srgb, var(--warn) 45%, var(--bad));
        --lvl3: var(--bad);
        --lvl4: color-mix(in srgb, var(--bad) 45%, #7a3cff);
    }

    html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; }
    * { box-sizing: border-box; }
    button { font: inherit; color: inherit; }

    #tile {
        position: relative;
        width: 100%;
        height: 100%;
        container: tile / size;
        overflow: hidden;
        border-radius: inherit;
        --hdr: clamp(34px, 11cqmin, 46px);
    }
    #sky { position: absolute; inset: 0; display: none; pointer-events: none; }
    #wrap {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: minmax(0, 1fr);
        grid-template-rows: auto auto auto auto minmax(0, 1fr) auto;
        grid-template-areas: "hero" "chips" "warn" "hourly" "daily" "foot";
        gap: 10px;
        /* oben Platz für Titel und Vergrößern-Symbol, die Symcon über die Kachel legt */
        padding: var(--hdr) clamp(10px, 4cqmin, 16px) clamp(10px, 4cqmin, 16px);
    }

    /* ---------- Aktuelles Wetter ---------- */
    .hero { grid-area: hero; display: flex; align-items: center; gap: clamp(6px, 3cqmin, 14px); min-width: 0; }
    .hero .wx { width: clamp(52px, 24cqmin, 96px); height: clamp(52px, 24cqmin, 96px); flex: none; }
    .temp { font-size: clamp(38px, 20cqmin, 76px); font-weight: 300; line-height: .95; letter-spacing: -.03em; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .temp sup { font-size: .45em; font-weight: 400; vertical-align: .9em; margin-left: 1px; color: var(--muted); }
    .side { min-width: 0; display: flex; flex-direction: column; gap: 3px; margin-left: auto; text-align: right; }
    .name { font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .cond { font-size: clamp(14px, 5cqmin, 17px); font-weight: 600; line-height: 1.2; }
    .hilo { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
    .hilo b { color: var(--fg); font-weight: 600; }
    .station { font-size: 11.5px; line-height: 1.3; color: var(--muted); max-height: 2.6em; overflow: hidden; }
    .station:empty { display: none; }

    /* ---------- Kurzwerte ---------- */
    .chips { grid-area: chips; display: flex; flex-wrap: wrap; gap: 6px; max-height: 58px; overflow: hidden; }
    .chip {
        display: inline-flex; align-items: center; gap: 6px;
        padding: 5px 10px; border-radius: var(--pill);
        background: var(--surface); font-size: 12.5px; white-space: nowrap; font-variant-numeric: tabular-nums;
    }
    .chip span { color: var(--muted); }
    .chip svg { width: 13px; height: 13px; flex: none; }
    .arrow { transition: transform .4s; }

    /* ---------- Warnungen ---------- */
    .mid { grid-area: warn; display: flex; flex-direction: column; gap: 8px; min-width: 0; min-height: 0; }
    .warns { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

    /* Sonnenbogen: Stand der Sonne zwischen Auf- und Untergang (nachts der Mond) */
    .sunarc { display: none; position: relative; height: 74px; flex: none; }
    .sunarc svg { width: 100%; height: 100%; overflow: visible; }
    .sunarc .track { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 3 5; stroke-linecap: round; }
    .sunarc .done { fill: none; stroke: var(--wx-sun); stroke-width: 2.5; stroke-linecap: round; opacity: .9; }
    .sunarc.night .done { stroke: var(--wx-moon); opacity: .6; }
    .sunarc .horizon { stroke: var(--line); stroke-width: 1; }
    .sunarc .lbl { font-size: 11px; fill: var(--muted); font-variant-numeric: tabular-nums; }
    .sunarc .mid-lbl { font-size: 11.5px; fill: var(--fg); font-weight: 600; }
    .sunarc .orb { transition: transform 1s ease; }
    .warn {
        --lvl: var(--lvl1);
        border-radius: var(--radius);
        background: color-mix(in srgb, var(--lvl) 17%, transparent);
        border-left: 4px solid var(--lvl);
        padding: 7px 8px 7px 10px;
        display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; column-gap: 8px; align-items: center;
    }
    .warn[data-l="2"] { --lvl: var(--lvl2); }
    .warn[data-l="3"] { --lvl: var(--lvl3); }
    .warn[data-l="4"] { --lvl: var(--lvl4); }
    .warn > svg { width: 18px; height: 18px; color: var(--lvl); }
    .warn .t { font-size: 13px; font-weight: 600; line-height: 1.25; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .warn .p { font-size: 11.5px; color: var(--muted); }
    .warn .lv {
        display: inline-block; max-width: 100%; margin-bottom: 3px; padding: 1px 8px; border-radius: var(--pill);
        background: var(--lvl); color: #fff; font-size: 10.5px; font-weight: 700; letter-spacing: .02em;
        white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-shadow: 0 1px 1px rgba(0, 0, 0, .25);
    }
    .warn[data-l="1"] .lv { color: #3a2a00; text-shadow: none; }
    .warn .cnt { display: none; margin-left: 6px; padding: 0 6px; border-radius: var(--pill); background: var(--lvl); color: #fff; font-weight: 700; font-size: 10.5px; }
    .warn button {
        min-height: 36px; min-width: 36px; padding: 0 10px; border: 0; border-radius: var(--radius-s);
        background: var(--surface); cursor: pointer; font-size: 12px;
    }
    .warn button:hover { background: var(--surface-hover); }
    .warn .more { grid-column: 1 / -1; display: none; margin-top: 6px; font-size: 12.5px; line-height: 1.4; white-space: pre-line; max-height: 40cqh; overflow-y: auto; }
    .warn .more p { margin: 0 0 6px; }
    .warn .more p.i { color: var(--muted); }
    .warn.open .more { display: block; }
    .warn.open .t { white-space: normal; }
    .warns .okline { font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 6px; }
    .warns .okline i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }

    /* ---------- Stunden ---------- */
    .sec { min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 6px; }
    .sec h3 { margin: 0; font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: .07em; color: var(--faint); }
    #hourly { grid-area: hourly; }
    .hours { display: flex; gap: 2px; overflow-x: auto; scrollbar-width: none; scroll-snap-type: x proximity; padding-bottom: 2px; }
    .hours::-webkit-scrollbar { display: none; }
    .hour {
        flex: none; width: 48px; display: flex; flex-direction: column; align-items: center; gap: 3px;
        padding: 6px 0; border-radius: var(--radius-s); scroll-snap-align: start; font-variant-numeric: tabular-nums;
    }
    .hour:first-child { background: var(--surface); }
    .hour .h { font-size: 11.5px; color: var(--muted); }
    .hour .wx { width: 28px; height: 28px; }
    .hour .v { font-size: 14px; font-weight: 600; }
    .hour .cv { height: 26px; display: none; }
    .hours { position: relative; }
    .hours > svg.curve { position: absolute; left: 0; pointer-events: none; overflow: visible; display: none; }
    .curve .line { fill: none; stroke: url(#g-curve); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
    .curve .area { fill: url(#g-curvefill); }
    .curve circle { fill: var(--fg); }
    #tile.big .hour .cv, #tile.big .hours > svg.curve { display: block; }
    .hour .r { font-size: 10.5px; color: var(--wx-rain); min-height: 13px; font-weight: 600; }

    /* ---------- Tage ---------- */
    #daily { grid-area: daily; }
    .days { overflow-y: auto; scrollbar-width: thin; min-height: 0; }
    .day {
        display: grid; grid-template-columns: 3.1em 28px 3em 2.4em minmax(30px, 1fr) 2.4em; align-items: center; column-gap: 8px;
        height: 36px; border-top: 1px solid var(--line); font-size: 14px; font-variant-numeric: tabular-nums;
    }
    .day:first-child { border-top: 0; }
    .day .l { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .day .wx { width: 26px; height: 26px; }
    .day .r { font-size: 11.5px; color: var(--wx-rain); font-weight: 600; }
    .day .mn { color: var(--muted); text-align: right; }
    .day .mx { text-align: right; font-weight: 600; }
    .bar { position: relative; height: 5px; border-radius: var(--pill); background: var(--surface-hover); }
    .bar i { position: absolute; top: 0; bottom: 0; border-radius: var(--pill); background: linear-gradient(90deg, var(--wx-cold), var(--wx-warm)); background-size: var(--bw, 100%) 100%; background-position: var(--bx, 0) 0; }
    .bar b { position: absolute; top: 50%; width: 9px; height: 9px; margin: -4.5px 0 0 -4.5px; border-radius: 50%; background: var(--fg); box-shadow: 0 0 0 2px color-mix(in srgb, var(--fg) 25%, transparent); }

    /* ---------- Fuß ---------- */
    .foot { grid-area: foot; display: flex; align-items: center; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--faint); min-height: 36px; margin: -6px -4px -6px 0; }
    .foot span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    #refresh {
        width: 36px; height: 36px; flex: none; border: 0; border-radius: var(--pill);
        background: transparent; color: var(--muted); cursor: pointer; display: grid; place-items: center;
    }
    #refresh:hover { background: var(--surface); }
    #refresh svg { width: 16px; height: 16px; }
    #refresh.spin svg { animation: spin 1s linear infinite; }

    /* ---------- Fehler und Leerzustand ---------- */
    .error { position: absolute; left: 10px; right: 10px; top: 10px; z-index: 2; padding: 8px 12px; border-radius: var(--radius); background: color-mix(in srgb, var(--bad) 85%, transparent); color: #fff; font-size: 12.5px; font-weight: 600; display: none; }
    .empty { position: absolute; inset: 0; display: none; place-items: center; text-align: center; padding: 16px; color: var(--muted); font-size: 14px; }
    #tile.is-empty #wrap { visibility: hidden; }
    #tile.is-empty .empty { display: grid; }

    /* ---------- Größen ---------- */
    @container tile (max-height: 215px) {
        .chips, #hourly, #daily, .foot, .warns .okline, .warn .p, .warn .t, .warn button { display: none !important; }
        .warn { padding: 4px 8px; }
        .warn:not(:first-child) { display: none; }
    }
    @container tile (max-height: 480px) {
        #daily { display: none; }
        .chips { max-height: 30px; }
        .warn:not(:first-child) { display: none; }
        .warn .cnt { display: inline; }
    }
    @container tile (max-height: 480px) and (min-width: 640px) { #daily { display: flex; } }
    /* wenig Höhe: Kurzwerte weglassen, damit Warnung und Stunden ganz sichtbar bleiben */
    @container tile (max-height: 420px) { .chips { display: none; } }
    /* flache Kacheln (z. B. Handy quer): Stundenleiste kompakt, Fußzeile weg */
    @container tile (max-height: 300px) {
        .foot, #hourly h3, .hour .r { display: none; }
        #wrap { gap: 6px; }
        .hour { padding: 2px 0; gap: 1px; width: 44px; }
        .hour .wx { width: 22px; height: 22px; }
        .hour .v { font-size: 13px; }
        .warn { padding: 4px 8px; }
        .warn .p, .warn button { display: none; }
        .warn:not(:first-child) { display: none; }
    }
    /* sehr flach: von der Warnung nur das Stufen-Schild, damit die Stunden ganz sichtbar bleiben */
    @container tile (max-height: 260px) {
        .warn .t { display: none; }
        .warn { padding: 3px 8px; }
        .warn .lv { margin: 0; }
    }
    #tile.showsun .sunarc { display: block; }
    #tile.showsun.nosun .sunarc { display: none; }
    @container tile (max-width: 230px) {
        .side .name, .hilo, .station { display: none; }
        .hero { flex-wrap: wrap; }
        .side { margin-left: 0; text-align: left; width: 100%; }
    }
    @container tile (max-height: 420px) { .warns .okline { display: none; } }
    @container tile (min-width: 640px) {
        #wrap {
            grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
            grid-template-rows: auto auto minmax(0, 1fr) auto auto;
            grid-template-areas: "hero daily" "chips daily" "warn daily" "hourly hourly" "foot foot";
            column-gap: clamp(16px, 4cqw, 28px);
        }
        .mid { overflow-y: auto; }
    }
    @container tile (min-width: 640px) and (max-height: 215px) {
        #wrap { grid-template-areas: "hero warn" "chips daily" "warn daily" "hourly hourly" "foot foot"; }
    }

    /* ---------- Farbschema „Wetter“: Himmel passend zur Wetterlage ---------- */
    #tile.sky {
        --fg: #f6f9fc; --muted: rgba(246, 249, 252, .82); --faint: rgba(246, 249, 252, .68); --line: rgba(255, 255, 255, .18);
        --surface-hover: rgba(255, 255, 255, .22);
        --wx-cloud: #eef3f8; --wx-cloud2: rgba(238, 243, 248, .6); --wx-rain: #d3e8ff; --wx-cold: #bcdcff;
        color: var(--fg); text-shadow: 0 1px 3px rgba(0, 0, 0, .35);
    }
    #tile.sky .day .r, #tile.sky .hour .r { color: #e3f0ff; }
    #tile.sky #sky { display: block; transition: background .8s; }
    #tile.sky .warn { background: color-mix(in srgb, var(--lvl) 30%, rgba(0, 0, 0, .25)); }
    #tile.sky .hour:first-child, #tile.sky .chip { background: rgba(255, 255, 255, .14); }
    #sky[data-s="clear-1"]   { background: linear-gradient(180deg, #2367b3 0%, #3f88cf 60%, #5d9cd6 100%); }
    #sky[data-s="partly-1"]  { background: linear-gradient(180deg, #2f6299 0%, #4f83b6 70%, #6b95bf 100%); }
    #sky[data-s="cloudy-1"]  { background: linear-gradient(180deg, #56677a 0%, #7c8c9d 100%); }
    #sky[data-s="fog-1"]     { background: linear-gradient(180deg, #637079 0%, #7f8b95 100%); }
    #sky[data-s="drizzle-1"],
    #sky[data-s="rain-1"]    { background: linear-gradient(180deg, #3e4e61 0%, #627488 100%); }
    #sky[data-s="snow-1"]    { background: linear-gradient(180deg, #627488 0%, #8597aa 100%); }
    #sky[data-s="thunder-1"] { background: linear-gradient(180deg, #2b2a42 0%, #4d4568 100%); }
    #sky[data-s="clear-0"],
    #sky[data-s="partly-0"]  { background: linear-gradient(180deg, #0a1730 0%, #19305a 100%); }
    #sky[data-s="cloudy-0"],
    #sky[data-s="fog-0"]     { background: linear-gradient(180deg, #1b2530 0%, #313e4c 100%); }
    #sky[data-s="drizzle-0"],
    #sky[data-s="rain-0"],
    #sky[data-s="snow-0"]    { background: linear-gradient(180deg, #151e29 0%, #2a3746 100%); }
    #sky[data-s="thunder-0"] { background: linear-gradient(180deg, #16142a 0%, #2f2747 100%); }
    #sky[data-s="clear-1"]   { background: linear-gradient(180deg, #1660bd 0%, #3b8de0 55%, #8cc0ea 88%, #e9c98f 100%); }

    /* Szene: Sterne, Sonnen-/Mondschein, Wolken, Niederschlag – nur im Farbschema „Wetter“ */
    #sky > div { position: absolute; inset: 0; opacity: 0; transition: opacity .8s; }
    #sky .stars {
        background-image:
            radial-gradient(1.2px 1.2px at 8% 12%, #fff, transparent), radial-gradient(1px 1px at 22% 30%, #fff, transparent),
            radial-gradient(1.4px 1.4px at 37% 8%, #fff, transparent), radial-gradient(1px 1px at 52% 22%, #fff, transparent),
            radial-gradient(1.2px 1.2px at 66% 6%, #fff, transparent), radial-gradient(1px 1px at 78% 26%, #fff, transparent),
            radial-gradient(1.5px 1.5px at 91% 14%, #fff, transparent), radial-gradient(1px 1px at 14% 48%, #fff, transparent),
            radial-gradient(1.2px 1.2px at 46% 42%, #fff, transparent), radial-gradient(1px 1px at 72% 50%, #fff, transparent),
            radial-gradient(1px 1px at 30% 62%, #fff, transparent), radial-gradient(1.2px 1.2px at 86% 64%, #fff, transparent);
        animation: twinkle 5s ease-in-out infinite alternate;
    }
    #sky .glow { background: radial-gradient(circle at 86% 4%, rgba(255, 238, 180, .75) 0, rgba(255, 214, 120, .32) 14%, rgba(255, 214, 120, 0) 46%); }
    #sky .clouds {
        inset: -10% -15%;
        background:
            radial-gradient(ellipse 26% 10% at 18% 16%, rgba(255, 255, 255, .55), transparent 70%),
            radial-gradient(ellipse 20% 8% at 30% 12%, rgba(255, 255, 255, .45), transparent 70%),
            radial-gradient(ellipse 30% 11% at 72% 30%, rgba(255, 255, 255, .45), transparent 70%),
            radial-gradient(ellipse 24% 9% at 58% 52%, rgba(255, 255, 255, .3), transparent 70%),
            radial-gradient(ellipse 34% 12% at 26% 74%, rgba(255, 255, 255, .28), transparent 70%),
            radial-gradient(ellipse 28% 10% at 84% 86%, rgba(255, 255, 255, .25), transparent 70%);
        filter: blur(4px);
        animation: clouds 60s ease-in-out infinite alternate;
    }
    #sky .fx { inset: -20% 0 0 0; }

    #sky[data-s$="-0"] .stars { opacity: .8; }
    #sky[data-s^="cloudy-0"] .stars, #sky[data-s^="fog-0"] .stars, #sky[data-s^="rain-0"] .stars,
    #sky[data-s^="drizzle-0"] .stars, #sky[data-s^="snow-0"] .stars, #sky[data-s^="thunder-0"] .stars { opacity: .15; }
    #sky[data-s="clear-1"] .glow { opacity: 1; }
    #sky[data-s="partly-1"] .glow { opacity: .7; }
    #sky[data-s="clear-0"] .glow, #sky[data-s="partly-0"] .glow { opacity: .35; filter: hue-rotate(180deg) saturate(.3); }
    #sky[data-s^="partly"] .clouds { opacity: .4; }
    #sky[data-s^="cloudy"] .clouds, #sky[data-s^="fog"] .clouds { opacity: 1; filter: blur(6px) brightness(.85); }
    #sky[data-s^="rain"] .clouds, #sky[data-s^="drizzle"] .clouds, #sky[data-s^="snow"] .clouds { opacity: .6; filter: blur(6px) brightness(.7); }
    #sky[data-s^="thunder"] .clouds { opacity: .55; filter: blur(6px) brightness(.45); }
    #sky[data-s$="-0"] .clouds { filter: blur(6px) brightness(.35); }

    #sky[data-s^="rain"] .fx, #sky[data-s^="thunder"] .fx, #sky[data-s^="drizzle"] .fx {
        opacity: 1;
        background: repeating-linear-gradient(104deg, transparent 0 13px, rgba(205, 225, 255, .2) 13px 14px);
        background-size: 100% 90px;
        animation: rain .5s linear infinite;
    }
    #sky[data-s^="drizzle"] .fx { opacity: .55; animation-duration: .9s; }
    #sky[data-s^="snow"] .fx {
        opacity: 1;
        background:
            radial-gradient(2px 2px at 20% 20%, rgba(255, 255, 255, .85), transparent),
            radial-gradient(1.6px 1.6px at 70% 45%, rgba(255, 255, 255, .7), transparent),
            radial-gradient(2.2px 2.2px at 45% 80%, rgba(255, 255, 255, .8), transparent),
            radial-gradient(1.4px 1.4px at 90% 10%, rgba(255, 255, 255, .6), transparent);
        background-size: 70px 70px;
        animation: snow 7s linear infinite;
    }
    #sky[data-s^="fog"] .fx {
        opacity: 1;
        background: repeating-linear-gradient(180deg, transparent 0 22px, rgba(235, 240, 245, .16) 22px 40px, transparent 40px 64px);
        filter: blur(5px);
        animation: clouds 30s ease-in-out infinite alternate;
    }
    #sky[data-s^="thunder"] .glow { opacity: 1; background: rgba(220, 225, 255, .5); animation: flash 9s linear infinite; }

    /* ziehende Wolken, Sonne/Mond und Blitz (werden je nach Wetterlage erzeugt) */
    #sky > .fly, #sky > .orbit, #sky > .strike { opacity: 1; }
    #sky .fly svg { position: absolute; left: 0; top: 0; overflow: visible; animation: fly var(--d) linear infinite; animation-delay: var(--dl); will-change: transform; }
    #sky .orbit svg { position: absolute; overflow: visible; }
    #sky .orbit .sunrays { transform-box: fill-box; transform-origin: center; animation: spin 90s linear infinite; }
    #sky .strike svg { position: absolute; opacity: 0; animation: strike 9s linear infinite; animation-delay: var(--dl, 0s); filter: drop-shadow(0 0 6px rgba(255, 245, 190, .9)); }
    @keyframes fly { from { transform: translate(-110%, var(--y)); } to { transform: translate(calc(100cqw + 10%), var(--y)); } }
    @keyframes strike { 0%, 61%, 63.2%, 64.2%, 66%, 100% { opacity: 0; } 61.6%, 64.6% { opacity: 1; } }

    @keyframes twinkle { from { filter: brightness(.55); } to { filter: brightness(1.25); } }
    @keyframes clouds { from { transform: translateX(-4%); } to { transform: translateX(4%); } }
    @keyframes rain { to { background-position: -24px 90px; } }
    @keyframes snow { to { background-position: 14px 70px, -10px 70px, 6px 70px, -6px 70px; } }
    @keyframes flash { 0%, 61%, 63.5%, 65%, 100% { opacity: 0; } 62%, 64% { opacity: .9; } }

    /* ---------- Bewegung (ruht, wenn die Kachel nicht sichtbar ist) ---------- */
    .hero .rays { transform-origin: 32px 32px; animation: spin 60s linear infinite; }
    .hero .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 4s ease-in-out infinite alternate; }
    .hero .drops { animation: fall 1.1s linear infinite; }
    .hero .flakes { animation: drift 3s ease-in-out infinite alternate; }
    .hero .cloudmove { animation: drift 6s ease-in-out infinite alternate; }
    .hero .flash { animation: bolt 4s linear infinite; }
    .hero .snowfall { animation: snowfall 2.4s linear infinite; }
    .arrow.gusty { animation: wobble 1.6s ease-in-out infinite alternate; }
    .temp.tick { animation: tick .9s ease; }
    html.paused * { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { from { transform: scale(.92); opacity: .8; } to { transform: scale(1.06); opacity: 1; } }
    @keyframes fall { from { transform: translateY(-3px); opacity: .5; } 60% { opacity: 1; } to { transform: translateY(4px); opacity: .2; } }
    @keyframes drift { from { transform: translateX(-1.5px); } to { transform: translateX(1.5px); } }
    @keyframes bolt { 0%, 70%, 74%, 78%, 100% { opacity: 1; } 72%, 76% { opacity: .15; } }
    @keyframes snowfall { from { transform: translateY(-3px); opacity: .4; } 50% { opacity: 1; } to { transform: translateY(4px); opacity: .3; } }
    @keyframes wobble { from { transform: rotate(calc(var(--a) - 8deg)); } to { transform: rotate(calc(var(--a) + 8deg)); } }
    @keyframes tick { 0% { transform: translateY(0); } 30% { transform: translateY(-3px); } 100% { transform: translateY(0); } }
</style>

<script>
    // Hausstil: Farbschema der Kachel (0 = Symcon-Design, 1 = Dunkel, 2 = Hell)
    function applyTheme(theme) {
        var root = document.documentElement;
        root.classList.toggle('theme-dark', theme === 1);
        root.classList.toggle('theme-light', theme === 2);
    }

    (function () {
        var SVG = 'http://www.w3.org/2000/svg';
        var $ = function (id) { return document.getElementById(id); };
        var tile = $('tile');
        var nf0 = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 0 });
        var nf1 = new Intl.NumberFormat('de-DE', { maximumFractionDigits: 1 });
        var openWarn = {};

        // WMO-Code → Symbolgruppe
        function group(code) {
            if (code === 0) { return 'clear'; }
            if (code <= 2) { return 'partly'; }
            if (code === 3) { return 'cloudy'; }
            if (code === 45 || code === 48) { return 'fog'; }
            if (code >= 51 && code <= 57) { return 'drizzle'; }
            if ((code >= 61 && code <= 67) || (code >= 80 && code <= 82)) { return 'rain'; }
            if ((code >= 71 && code <= 77) || code === 85 || code === 86) { return 'snow'; }
            if (code >= 95) { return 'thunder'; }
            return 'cloudy';
        }

        // plastische Symbole (Standard)
        var PLASTIC = {
            clear: function (day) { return [day ? 'p-sun' : 'p-moon']; },
            partly: function (day) { return [day ? 'p-sunsm' : 'p-moonsm', 'p-cloud']; },
            cloudy: function () { return ['p-cloudback', 'p-cloud']; },
            fog: function () { return ['p-cloudhi', 'p-fog']; },
            drizzle: function (day, code) { return (day && code >= 80 ? ['p-sunsm'] : []).concat(['p-cloudrain', 'p-drizzle']); },
            // Schauer (80–82) bei Tag: Sonne hinter der Regenwolke
            rain: function (day, code) { return (day && code >= 80 ? ['p-sunsm'] : []).concat(['p-cloudrain', 'p-rain']); },
            snow: function (day, code) { return (day && code >= 85 ? ['p-sunsm'] : []).concat(['p-cloudhi', 'p-snow']); },
            thunder: function () { return ['p-clouddark', 'p-bolt']; }
        };
        var iconStyle = 0;

        // flache Symbole
        var LAYERS = {
            clear: function (day) { return [day ? 's-sun' : 's-moon']; },
            partly: function (day) { return [day ? 's-sunsm' : 's-moonsm', 's-cloud']; },
            cloudy: function () { return ['s-cloudback', 's-cloud']; },
            fog: function () { return ['s-cloudhi', 's-fog']; },
            drizzle: function () { return ['s-cloudhi', 's-drizzle']; },
            rain: function () { return ['s-cloudhi', 's-rain']; },
            snow: function () { return ['s-cloudhi', 's-snow']; },
            thunder: function () { return ['s-cloudhi', 's-bolt']; }
        };

        function el(tag, cls, text) {
            var e = document.createElement(tag);
            if (cls) { e.className = cls; }
            if (text !== undefined && text !== null) { e.textContent = String(text); }
            return e;
        }

        function use(svg, id) {
            var u = document.createElementNS(SVG, 'use');
            u.setAttribute('href', '#' + id);
            svg.appendChild(u);
        }

        function icon(code, day, svg, inline) {
            if (!svg) {
                svg = document.createElementNS(SVG, 'svg');
                svg.setAttribute('class', 'wx');
                svg.setAttribute('viewBox', '0 0 64 64');
                svg.setAttribute('aria-hidden', 'true');
            }
            while (svg.firstChild) { svg.removeChild(svg.firstChild); }
            (iconStyle === 1 ? LAYERS : PLASTIC)[group(code)](!!day, code).forEach(function (id) {
                if (!inline) { use(svg, id); return; }
                // großes Symbol als echte Kopie, damit es animiert werden kann
                var src = document.getElementById(id);
                for (var i = 0; i < src.childNodes.length; i++) {
                    svg.appendChild(src.childNodes[i].cloneNode(true));
                }
            });
            return svg;
        }

        function small(id) {
            var s = document.createElementNS(SVG, 'svg');
            s.setAttribute('aria-hidden', 'true');
            use(s, id);
            return s;
        }

        function deg(v) { return nf0.format(Math.round(v)) + '°'; }

        function chip(label, value, iconId, rotate) {
            var c = el('div', 'chip');
            if (iconId) {
                var s = small(iconId);
                if (rotate !== undefined) {
                    s.classList.add('arrow');
                    s.style.setProperty('--a', rotate + 'deg');
                    s.style.transform = 'rotate(' + rotate + 'deg)';
                }
                c.appendChild(s);
            }
            if (label) { c.appendChild(el('span', '', label)); }
            c.appendChild(document.createTextNode(value));
            return c;
        }

        function clear(node) { while (node.firstChild) { node.removeChild(node.firstChild); } }

        // Himmels-Szene im Farbschema „Wetter“: ziehende Wolken, Sonne/Mond, Blitze
        var sceneKey = '';
        function skySvg(id, w, h) {
            var svg = document.createElementNS(SVG, 'svg');
            svg.setAttribute('viewBox', '0 0 64 64');
            svg.setAttribute('width', w);
            svg.setAttribute('height', h || w);
            var u = document.createElementNS(SVG, 'use');
            u.setAttribute('href', '#' + id);
            svg.appendChild(u);
            return svg;
        }
        function buildScene(g, day, code) {
            var key = g + day + (code >= 80 ? 's' : '');
            if (key === sceneKey) { return; }
            sceneKey = key;
            var fly = $('skyFly'), orb = $('skyOrb'), strike = $('skyStrike');
            clear(fly); clear(orb); clear(strike);
            // Anzahl, Art und Tempo der Wolken je Wetterlage
            var cfg = {
                clear:   { n: day ? 1 : 0, id: 'p-cloud', op: .55, size: [70, 110] },
                partly:  { n: 4, id: 'p-cloud', op: .9, size: [90, 170] },
                cloudy:  { n: 7, id: 'p-cloudrain', op: .9, size: [130, 240] },
                fog:     { n: 5, id: 'p-cloudrain', op: .5, size: [160, 260] },
                drizzle: { n: 6, id: 'p-cloudrain', op: .85, size: [130, 220] },
                rain:    { n: 7, id: 'p-cloudrain', op: .9, size: [140, 240] },
                snow:    { n: 6, id: 'p-cloudrain', op: .8, size: [130, 220] },
                thunder: { n: 7, id: 'p-clouddark', op: .95, size: [150, 260] }
            }[g] || { n: 3, id: 'p-cloud', op: .8, size: [100, 180] };
            if (!day && cfg.id === 'p-cloud') { cfg.op *= .45; }
            for (var i = 0; i < cfg.n; i++) {
                var w = cfg.size[0] + Math.random() * (cfg.size[1] - cfg.size[0]);
                var c = skySvg(cfg.id, Math.round(w), Math.round(w * .62));
                var dur = 70 + Math.random() * 70 - (g === 'thunder' || g === 'rain' ? 25 : 0);
                c.style.setProperty('--d', dur.toFixed(0) + 's');
                // negativer Versatz: Wolken sind sofort verteilt, nicht erst am linken Rand
                c.style.setProperty('--dl', (-Math.random() * dur).toFixed(1) + 's');
                c.style.setProperty('--y', (Math.random() * 55 - 15).toFixed(0) + 'cqh');
                c.style.opacity = (cfg.op * .75 * (.7 + Math.random() * .3)).toFixed(2);
                if (!day) { c.style.filter = 'brightness(.55)'; }
                fly.appendChild(c);
            }
            // Gewitter: zwei Blitze an zufälligen Stellen
            if (g === 'thunder') {
                for (var k = 0; k < 2; k++) {
                    var b = document.createElementNS(SVG, 'svg');
                    b.setAttribute('viewBox', '0 0 40 100');
                    b.setAttribute('width', 46);
                    b.setAttribute('height', 115);
                    var bp = document.createElementNS(SVG, 'path');
                    bp.setAttribute('d', 'M24 0 8 46h12L6 100 36 38H22L32 0z');
                    bp.setAttribute('fill', '#fff7c2');
                    b.appendChild(bp);
                    b.style.left = (15 + Math.random() * 65).toFixed(0) + '%';
                    b.style.top = (8 + Math.random() * 25).toFixed(0) + '%';
                    b.style.setProperty('--dl', (-k * 4.3).toFixed(1) + 's');
                    strike.appendChild(b);
                }
            }
        }

        // Temperatur: bei Änderung kurz hochzählen
        var shownTemp = null;
        function setTemp(v) {
            var box = $('temp');
            box.textContent = nf0.format(v);
            var sup = document.createElement('sup');
            sup.textContent = '°C';
            box.appendChild(sup);
        }
        function showTemp(target) {
            var from = shownTemp;
            shownTemp = target;
            var calm = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            if (from === null || from === target || calm || document.hidden) { setTemp(target); return; }
            var start = null, box = $('temp');
            box.classList.remove('tick'); void box.offsetWidth; box.classList.add('tick');
            function step(ts) {
                if (start === null) { start = ts; }
                var k = Math.min(1, (ts - start) / 800);
                setTemp(Math.round(from + (target - from) * (1 - Math.pow(1 - k, 3))));
                if (k < 1 && shownTemp === target) { requestAnimationFrame(step); }
            }
            requestAnimationFrame(step);
        }

        // Sonnenbogen
        var sunData = null, sunText = { dayLeft: '', riseIn: '' };
        function fmtDur(sec) {
            var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60);
            return (h > 0 ? h + ' h ' : '') + m + ' min';
        }
        function renderSun() {
            var box = $('sunarc');
            clear(box);
            if (!sunData || !sunData[0] || !sunData[1]) { return; }
            var now = Date.now() / 1000, rise = sunData[0], set = sunData[1], next = sunData[2] || rise + 86400;
            var night = now < rise || now > set, f, text;
            if (!night) {
                f = (now - rise) / (set - rise);
                text = sunText.dayLeft.replace('%s', fmtDur(set - now));
            } else {
                var a = now > set ? set : set - 86400, b = now > set ? next : rise;
                f = (now - a) / (b - a);
                text = sunText.riseIn.replace('%s', fmtDur(b - now));
            }
            f = Math.max(0, Math.min(1, f));
            box.classList.toggle('night', night);
            var W = Math.max(160, box.clientWidth || 300), H = 74, x0 = 18, x1 = W - 18, base = 52, top = 10;
            var svg = document.createElementNS(SVG, 'svg');
            svg.setAttribute('viewBox', '0 0 ' + W + ' ' + H);
            var cx = (x0 + x1) / 2, rx = (x1 - x0) / 2, ry = base - top;
            function pt(k) { var a = Math.PI * (1 - k); return [cx + rx * Math.cos(a), base - ry * Math.sin(a)]; }
            function arcPath(k) {
                var d = 'M' + x0 + ' ' + base;
                for (var i = 1; i <= 40; i++) { var q = pt(k * i / 40); d += ' L' + q[0].toFixed(1) + ' ' + q[1].toFixed(1); }
                return d;
            }
            function mk(tag, attrs, cls) {
                var e = document.createElementNS(SVG, tag);
                for (var k in attrs) { e.setAttribute(k, attrs[k]); }
                if (cls) { e.setAttribute('class', cls); }
                svg.appendChild(e);
                return e;
            }
            mk('line', { x1: 4, y1: base, x2: W - 4, y2: base }, 'horizon');
            mk('path', { d: arcPath(1) }, 'track');
            mk('path', { d: arcPath(f) }, 'done');
            var p = pt(f);
            var orb = mk('g', { transform: 'translate(' + p[0].toFixed(1) + ' ' + p[1].toFixed(1) + ')' }, 'orb');
            var u = document.createElementNS(SVG, 'use');
            u.setAttribute('href', night ? '#p-moon' : '#p-sun');
            u.setAttribute('x', -13); u.setAttribute('y', -13); u.setAttribute('width', 26); u.setAttribute('height', 26);
            orb.appendChild(u);
            var t1 = mk('text', { x: x0 - 6, y: H - 4 }, 'lbl'); t1.textContent = '↑ ' + (sunData.riseText || '');
            var t2 = mk('text', { x: x1 + 6, y: H - 4, 'text-anchor': 'end' }, 'lbl'); t2.textContent = '↓ ' + (sunData.setText || '');
            var t3 = mk('text', { x: cx, y: H - 4, 'text-anchor': 'middle' }, 'mid-lbl'); t3.textContent = text;
            box.appendChild(svg);
        }
        setInterval(function () { if (!document.hidden) { renderSun(); } }, 60000);

        // Sonnenbogen nur zeigen, wenn er ohne Abschneiden in die Spalte passt
        function fitSun() {
            var mid = document.querySelector('.mid');
            tile.classList.remove('nosun');
            if (tile.classList.contains('showsun') && mid.scrollHeight > mid.clientHeight + 1) {
                tile.classList.add('nosun');
            }
        }

        // Temperaturkurve über der Stundenleiste (nur große Kacheln)
        function drawCurve(box, hours) {
            var spacer = box.querySelector('.cv');
            if (!spacer || hours.length < 2) { return; }
            var temps = hours.map(function (h) { return h[3]; });
            var lo = Math.min.apply(null, temps), hi = Math.max.apply(null, temps), span = Math.max(1, hi - lo);
            var step = 50, half = 24, top = spacer.offsetTop, h = 26;
            var pts = temps.map(function (v, i) { return [half + i * step, 3 + (1 - (v - lo) / span) * (h - 6)]; });
            var d = 'M' + pts[0][0] + ' ' + pts[0][1];
            for (var i = 1; i < pts.length; i++) {
                var p0 = pts[i - 2] || pts[i - 1], p1 = pts[i - 1], p2 = pts[i], p3 = pts[i + 1] || p2;
                d += ' C' + (p1[0] + (p2[0] - p0[0]) / 6).toFixed(1) + ' ' + (p1[1] + (p2[1] - p0[1]) / 6).toFixed(1) + ' ' +
                    (p2[0] - (p3[0] - p1[0]) / 6).toFixed(1) + ' ' + (p2[1] - (p3[1] - p1[1]) / 6).toFixed(1) + ' ' + p2[0] + ' ' + p2[1].toFixed(1);
            }
            var w = half * 2 + (pts.length - 1) * step;
            var svg = document.createElementNS(SVG, 'svg');
            svg.setAttribute('class', 'curve');
            svg.setAttribute('width', w); svg.setAttribute('height', h);
            svg.style.top = top + 'px';
            var area = document.createElementNS(SVG, 'path');
            area.setAttribute('class', 'area');
            area.setAttribute('d', d + ' L' + pts[pts.length - 1][0] + ' ' + h + ' L' + pts[0][0] + ' ' + h + 'Z');
            svg.appendChild(area);
            var line = document.createElementNS(SVG, 'path');
            line.setAttribute('class', 'line');
            line.setAttribute('d', d);
            svg.appendChild(line);
            pts.forEach(function (q) {
                var c = document.createElementNS(SVG, 'circle');
                c.setAttribute('cx', q[0]); c.setAttribute('cy', q[1].toFixed(1)); c.setAttribute('r', 2.2);
                svg.appendChild(c);
            });
            box.insertBefore(svg, box.firstChild);
        }

        function renderWarnings(d, t) {
            var box = $('warns');
            clear(box);
            if (!d.show || !d.show.warnings || d.warnOutside) { box.style.display = 'none'; return; }
            box.style.display = '';
            var list = d.warn || [];
            if (list.length === 0) {
                var ok = el('div', 'okline');
                ok.appendChild(el('i'));
                ok.appendChild(document.createTextNode((t.level || 'Level') + ' 0 · ' + (t.noWarn || '')));
                box.appendChild(ok);
                return;
            }
            list.forEach(function (w, i) {
                // w = [Stufe, Überschrift, Zeitraum, Beschreibung, Handlungsempfehlung]
                var key = w[1] + '|' + w[2];
                var row = el('div', 'warn' + (openWarn[key] ? ' open' : ''));
                row.setAttribute('data-l', String(w[0]));
                var s = small('s-warn');
                s.setAttribute('viewBox', '0 0 24 24');
                row.appendChild(s);
                var txt = el('div');
                txt.appendChild(el('div', 't', w[1] || (t.levels && t.levels[w[0]]) || ''));
                // Warnstufe als farbiges Schild, z. B. „Stufe 3 · Unwetterwarnung“
                var lv = el('div', 'lv', (t.level || 'Level') + ' ' + w[0] + (t.levels && t.levels[w[0]] ? ' · ' + t.levels[w[0]] : ''));
                txt.appendChild(lv);
                if (w[2] || (i === 0 && list.length > 1)) {
                    var p = el('div', 'p', w[2] || '');
                    // bei wenig Platz steht nur die schwerste Warnung da – Anzahl der übrigen anzeigen
                    if (i === 0 && list.length > 1) { p.appendChild(el('span', 'cnt', '+' + (list.length - 1))); }
                    txt.appendChild(p);
                }
                row.appendChild(txt);
                if (w[3] || w[4]) {
                    var b = el('button', '', openWarn[key] ? t.less : t.more);
                    b.type = 'button';
                    b.setAttribute('aria-expanded', openWarn[key] ? 'true' : 'false');
                    b.addEventListener('click', function () {
                        openWarn[key] = !openWarn[key];
                        row.classList.toggle('open', openWarn[key]);
                        b.textContent = openWarn[key] ? t.less : t.more;
                        b.setAttribute('aria-expanded', openWarn[key] ? 'true' : 'false');
                    });
                    row.appendChild(b);
                    var more = el('div', 'more');
                    if (w[3]) { more.appendChild(el('p', '', w[3])); }
                    if (w[4]) { more.appendChild(el('p', 'i', w[4])); }
                    row.appendChild(more);
                } else {
                    row.appendChild(el('span'));
                }
                if (i > 2) { row.style.display = 'none'; }
                box.appendChild(row);
            });
        }

        function renderHours(d, t) {
            var sec = $('hourly');
            var box = $('hours');
            clear(box);
            if (!d.show || !d.show.hourly || !d.hours || d.hours.length === 0) { sec.style.display = 'none'; return; }
            sec.style.display = '';
            $('hourlyTitle').textContent = t.hourly || '';
            d.hours.forEach(function (h) {
                // h = [Beschriftung, Code, Tag, Temperatur, Regenwahrscheinlichkeit]
                var c = el('div', 'hour');
                c.appendChild(el('div', 'h', h[0]));
                c.appendChild(icon(h[1], h[2]));
                c.appendChild(el('div', 'cv'));
                c.appendChild(el('div', 'v', deg(h[3])));
                c.appendChild(el('div', 'r', h[4] >= 20 ? h[4] + ' %' : ''));
                box.appendChild(c);
            });
            lastHours = d.hours;
            if (tile.classList.contains('big')) { drawCurve(box, d.hours); }
        }
        var lastHours = null;

        function renderDays(d, t) {
            var sec = $('daily');
            var box = $('days');
            clear(box);
            if (!d.show || !d.show.daily || !d.days || d.days.length === 0) { sec.style.display = 'none'; return; }
            sec.style.display = '';
            $('dailyTitle').textContent = t.daily || '';
            var lo = Infinity, hi = -Infinity;
            d.days.forEach(function (x) { lo = Math.min(lo, x[2]); hi = Math.max(hi, x[3]); });
            if (d.now) { lo = Math.min(lo, d.now.temp); hi = Math.max(hi, d.now.temp); }
            var span = Math.max(1, hi - lo);
            d.days.forEach(function (x, i) {
                // x = [Tag, Code, Min, Max, Regenwahrscheinlichkeit, Niederschlag]
                var r = el('div', 'day');
                r.appendChild(el('div', 'l', x[0]));
                r.appendChild(icon(x[1], 1));
                r.appendChild(el('div', 'r', x[4] >= 20 ? x[4] + ' %' : ''));
                r.appendChild(el('div', 'mn', deg(x[2])));
                var bar = el('div', 'bar');
                var fill = el('i');
                var left = (x[2] - lo) / span * 100;
                var width = Math.max(3, (x[3] - x[2]) / span * 100);
                fill.style.left = left + '%';
                fill.style.width = width + '%';
                // Verlauf über die ganze Skala, damit kalte Tage blau und warme Tage gelb wirken
                fill.style.setProperty('--bw', (100 / width * 100) + '%');
                fill.style.setProperty('--bx', (left / (100 - width || 1) * 100) + '%');
                bar.appendChild(fill);
                if (i === 0 && d.now) {
                    var dot = el('b');
                    dot.style.left = ((d.now.temp - lo) / span * 100) + '%';
                    bar.appendChild(dot);
                }
                r.appendChild(bar);
                r.appendChild(el('div', 'mx', deg(x[3])));
                box.appendChild(r);
            });
        }

        function render(d) {
            if (!d || typeof d !== 'object') { return; }
            var theme = d.theme | 0;
            applyTheme(theme === 1 ? 1 : (theme === 2 ? 2 : 0));
            tile.classList.toggle('sky', theme === 3);
            var t = d.i18n || {};
            iconStyle = d.icons === 1 ? 1 : 0;
            if (d.lang) {
                nf0 = new Intl.NumberFormat(d.lang, { maximumFractionDigits: 0 });
                nf1 = new Intl.NumberFormat(d.lang, { maximumFractionDigits: 1 });
            }

            $('error').style.display = d.error && d.now ? 'block' : 'none';
            $('error').textContent = d.error || '';
            tile.classList.toggle('is-empty', !d.now);
            $('empty').textContent = d.now ? '' : (d.error || '');
            if (!d.now) { return; }

            var n = d.now;
            var g = group(n.code);
            $('sky').setAttribute('data-s', g + '-' + (n.day ? 1 : 0));
            if (theme === 3) { buildScene(g, n.day ? 1 : 0, n.code); }
            var hero = icon(n.code, n.day, $('heroIcon'), true);
            hero.setAttribute('aria-label', n.cond || '');
            showTemp(Math.round(n.temp));
            $('name').textContent = d.name || '';
            $('cond').textContent = n.cond || '';
            $('station').textContent = d.station || '';

            var hilo = $('hilo');
            clear(hilo);
            if (d.today) {
                hilo.appendChild(document.createTextNode('↑ '));
                hilo.appendChild(el('b', '', deg(d.today.max)));
                hilo.appendChild(document.createTextNode('  ↓ '));
                hilo.appendChild(el('b', '', deg(d.today.min)));
            }

            var chips = $('chips');
            clear(chips);
            chips.style.display = d.show && d.show.details ? '' : 'none';
            if (d.show && d.show.details) {
                chips.appendChild(chip(t.feels, ' ' + deg(n.feels)));
                // Pfeil zeigt, wohin der Wind weht (Windrichtung = woher)
                var windChip = chip(t.wind, ' ' + nf0.format(n.wind) + ' ' + d.unit + ' ' + n.dir, 's-arrow', (n.deg + 180) % 360);
                // bei böigem Wind pendelt der Pfeil
                if (n.gust > n.wind * 1.4 && n.gust >= (d.unit === 'km/h' ? 20 : (d.unit === 'm/s' ? 5.5 : 11))) {
                    windChip.querySelector('.arrow').classList.add('gusty');
                }
                chips.appendChild(windChip);
                if (n.gust > n.wind * 1.3 && n.gust > 0) { chips.appendChild(chip(t.gusts, ' ' + nf0.format(n.gust))); }
                chips.appendChild(chip(t.humidity, ' ' + nf0.format(n.hum) + ' %'));
                if (n.precip > 0) { chips.appendChild(chip(t.precip, ' ' + nf1.format(n.precip) + ' mm')); }
                if (n.uv >= 1) { chips.appendChild(chip(t.uv, ' ' + nf0.format(n.uv))); }
                if (d.today && d.today.rise) {
                    chips.appendChild(chip('', ' ' + d.today.rise, 's-sunrise'));
                    chips.appendChild(chip('', ' ' + d.today.set, 's-sunset'));
                }
            }

            sunText = { dayLeft: t.dayLeft || '%s', riseIn: t.riseIn || '%s' };
            sunData = d.today && d.today.sun ? d.today.sun.slice() : null;
            if (sunData) { sunData.riseText = d.today.rise; sunData.setText = d.today.set; }
            renderSun();

            renderWarnings(d, t);
            fitSun();
            renderHours(d, t);
            renderDays(d, t);

            $('foot').textContent = (t.source || '') + ' · ' + (d.updated || '');
            $('refresh').setAttribute('aria-label', t.refresh || '');
            $('refresh').title = t.refresh || '';
            $('refresh').classList.remove('spin');
        }

        $('refresh').addEventListener('click', function () {
            if (typeof requestAction === 'function') {
                this.classList.add('spin');
                var btn = this;
                setTimeout(function () { btn.classList.remove('spin'); }, 8000);
                requestAction('TileRefresh', true);
            }
        });

        // Große Kacheln (z. B. Vollbild) gleichmäßig vergrößern statt Leerraum zu lassen
        function updateScale() {
            var w = tile.clientWidth, h = tile.clientHeight;
            var scale = Math.max(1, Math.min(2.2, Math.min(w / 900, h / 640)));
            var wrap = $('wrap');
            // Platz nach der Vergrößerung entscheidet über Kurve und Sonnenbogen
            var ew = w / (scale > 1.05 ? scale : 1), eh = h / (scale > 1.05 ? scale : 1);
            var big = (eh >= 560) || (ew >= 640 && eh >= 500);
            tile.classList.toggle('showsun', (eh >= 520) || (ew >= 640 && eh >= 480));
            fitSun();
            renderSun();
            if (big !== tile.classList.contains('big')) {
                tile.classList.toggle('big', big);
                // Kurve neu zeichnen bzw. entfernen
                var hb = $('hours'), old = hb.querySelector('svg.curve');
                if (old) { hb.removeChild(old); }
                if (big && lastHours) { drawCurve(hb, lastHours); }
            }
            wrap.style.zoom = scale > 1.05 ? String(scale) : '';
            wrap.style.height = scale > 1.05 ? (h / scale) + 'px' : '';
        }
        if (window.ResizeObserver) { new ResizeObserver(updateScale).observe(tile); }
        updateScale();

        // Animationen ruhen, wenn die Kachel nicht sichtbar ist
        var visible = true;
        function updatePause() {
            document.documentElement.classList.toggle('paused', document.hidden || !visible);
        }
        document.addEventListener('visibilitychange', updatePause);
        if (window.IntersectionObserver) {
            new IntersectionObserver(function (entries) {
                visible = entries[0].isIntersecting;
                updatePause();
            }).observe(tile);
        }

        // Wird von IP-Symcon bei UpdateVisualizationValue() aufgerufen
        window.handleMessage = function (data) {
            try {
                render(typeof data === 'string' ? JSON.parse(data) : data);
            } catch (e) {
                console.error('Wetter-Kachel:', e);
            }
        };

        var initial = /*INITIAL_DATA*/null;
        if (initial) {
            window.handleMessage(initial);
        }
    })();
</script>
